<!DOCTYPE html>
<html>

<head>
    <title>Design</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-primary);
        }

        #controls {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 100;
            background: var(--bg-card);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--accent-light);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            font-family: var(--font-sans);
            color: var(--text-primary);
            width: 300px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        select {
            margin-bottom: 15px;
            padding: 10px 12px;
            width: 100%;
            background: var(--bg-base);
            color: var(--text-primary);
            border: 1px solid var(--accent-light);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--accent-beige);
        }

        small {
            font-family: var(--font-mono);
            color: var(--text-secondary);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        hr {
            border: 0;
            border-top: 1px dashed var(--accent-light);
            margin: 15px 0;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-mono);
            font-size: 1rem;
            letter-spacing: 0.1em;
            color: var(--accent-beige);
            display: none;
            z-index: 50;
        }
        
        .viewer-btn {
            display: block;
            padding: 12px;
            background: transparent;
            color: var(--accent-beige);
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            border: 1px solid var(--accent-beige);
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            width: 100%;
            box-sizing: border-box;
        }
        
        .viewer-btn:hover {
            background: var(--accent-beige);
            color: var(--bg-card);
        }
    </style>
</head>

<body>
    <div id="controls">
        <a href="index.html" class="viewer-btn" style="margin-bottom: 24px; border-color: transparent; padding: 0; text-align: left; opacity: 0.8;">&larr; BACK TO HOME</a>
        <h3>Design</h3>
        <select id="fileSelect">
            <option value="exports/main_chassis.stl">Main Chassis (Inner Body)</option>
            <option value="exports/front_plate.stl">Front Plate (Lens & Flash)</option>
            <option value="exports/back_plate.stl">Back Plate (Screen)</option>
            <option value="exports/battery_door.stl">Battery Door</option>
            <option value="exports/sd_door.stl">SD Card Door</option>
            <option value="assembled">Full Camera Assembly (Exploded/Assembled)</option>
            <option value="camera_design">Camera Design (with Electronics)</option>
        </select>
        <br>
        <small>Drag to rotate &bull; Scroll to zoom</small>
        <hr>
        <div id="measureSection">
            <label style="display: flex; align-items: center; cursor: pointer; font-size: 12px; font-family: var(--font-mono); color: var(--text-primary); letter-spacing: 0.05em; text-transform: uppercase;">
                <input type="checkbox" id="measureToggle" style="margin-right: 10px; width: auto; cursor: pointer;">
                Enable 3D Ruler (mm)
            </label>
            <div id="measureResults"
                style="margin-top: 15px; display: none; font-size: 12px; line-height: 1.6; font-family: var(--font-mono); color: var(--text-secondary);">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed var(--accent-light); padding-bottom: 4px; margin-bottom: 4px;"><span style="color: var(--text-primary); font-weight: bold;">P1:</span> <span id="p1Coords">None</span></div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed var(--accent-light); padding-bottom: 4px; margin-bottom: 4px;"><span style="color: var(--text-primary); font-weight: bold;">P2:</span> <span id="p2Coords">None</span></div>
                <div style="margin-top: 12px; font-size: 14px; font-weight: bold; color: var(--accent-beige); display: flex; justify-content: space-between;"><span>DISTANCE</span> <span id="distVal">-- mm</span></div>
                <button id="clearMeasureBtn" class="viewer-btn" style="margin-top: 15px;">Clear Points</button>
            </div>
        </div>
        <hr>
        <a href="exports/euclidcam_stls.zip" download class="viewer-btn">
            Download Design
        </a>
    </div>
    <div id="loading">Loading Model...</div>

    <!-- Include Three.js and STLLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

    <script>
        let scene, camera, renderer, mesh, controls;
        let assemblyGroup = null;

        // Measurement Tool State
        let measureEnabled = false;
        let point1 = null;
        let point2 = null;
        let marker1 = null;
        let marker2 = null;
        let measureLine = null;
        let pointerStartX = 0;
        let pointerStartY = 0;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Set camera further back for the large chassis
            camera.position.set(200, 150, 200);
            controls.update();

            // Lighting setup for sleek CAD look
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 50);
            scene.add(dirLight);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight2.position.set(-100, -200, -50);
            scene.add(dirLight2);

            window.addEventListener('resize', onWindowResize, false);

            loadSTL(document.getElementById('fileSelect').value);

            document.getElementById('fileSelect').addEventListener('change', (e) => {
                loadSTL(e.target.value);
            });

            animate();
        }

        function loadAssembly(showElectronics) {
            document.getElementById('loading').style.display = 'block';
            assemblyGroup = new THREE.Group();
            assemblyGroup.rotation.x = -Math.PI / 2; // Orient CAD Z-up to Three.js Y-up
            scene.add(assemblyGroup);

            const loader = new THREE.STLLoader();
            const timestamp = new Date().getTime();

            // Define the 5 parts and their perfect CAD-space snapped coordinates
            const parts = [
                { path: 'exports/main_chassis.stl', color: 0xf5f5f0, pos: [0, 0, 0], rot: [0, 0, 0] },
                { path: 'exports/front_plate.stl', color: 0xff5500, roughness: 0.1, metalness: 0.4, pos: [0, 24, 0], rot: [-Math.PI / 2, 0, 0] },
                { path: 'exports/back_plate.stl', color: 0xff5500, roughness: 0.1, metalness: 0.4, pos: [0, -24, 0], rot: [-Math.PI / 2, 0, Math.PI] },
                { path: 'exports/battery_door.stl', color: 0xf5f5f0, pos: [-69.25, 0, 2.0], rot: [0, -Math.PI / 2, 0] },
                { path: 'exports/sd_door.stl', color: 0xf5f5f0, pos: [69.25, 0, -20.0], rot: [Math.PI, Math.PI / 2, 0] }
            ];

            let loadedCount = 0;

            parts.forEach(part => {
                loader.load(part.path + "?t=" + timestamp, function (geometry) {
                    const material = new THREE.MeshStandardMaterial({
                        color: part.color, 
                        roughness: part.roughness !== undefined ? part.roughness : 0.8, 
                        metalness: part.metalness !== undefined ? part.metalness : 0.1
                    });

                    const partMesh = new THREE.Mesh(geometry, material);
                    partMesh.position.set(part.pos[0], part.pos[1], part.pos[2]);
                    partMesh.rotation.set(part.rot[0], part.rot[1], part.rot[2]);

                    assemblyGroup.add(partMesh);

                    loadedCount++;
                    if (loadedCount === parts.length) {
                        document.getElementById('loading').style.display = 'none';
                        if (showElectronics) {
                            createElectronics(assemblyGroup);
                        }
                    }
                });
            });
        }

        // Programmatic Camera Electronics (Module, top buttons, screen)
        function createElectronics(group) {
            const electronicsGroup = new THREE.Group();

            // --- A. CAMERA BLACK GLASS LENS ---
            // Round black glass lens poking out of the front plate hole
            const lensGeo = new THREE.CylinderGeometry(5.75, 5.75, 12, 32);
            const lensMat = new THREE.MeshStandardMaterial({
                color: 0x050505,
                roughness: 0.05,
                metalness: 0.9,
                transparent: true,
                opacity: 0.95
            });
            const lens = new THREE.Mesh(lensGeo, lensMat);
            // CylinderGeometry aligns with Y-axis by default, which is the CAD front/back axis!
            lens.position.set(0, 25.0, 0); // Spans Y=19.0 to Y=31.0, poking out of front plate
            electronicsGroup.add(lens);

            // --- B. SILVER TOP BUTTONS ---
            const silverMat = new THREE.MeshStandardMaterial({
                color: 0xcccccc,      // Lightened the silver so it doesn't look too dark
                roughness: 0.35,     // Increased roughness to blur the reflections
                metalness: 0.5       // Pure metal should be 1.0
            });

            // Power Button (X=20, Y=0, Z=38, radius=9.5, height=10)
            const powerBtnGeo = new THREE.CylinderGeometry(9.5, 9.5, 10, 32);
            const powerBtn = new THREE.Mesh(powerBtnGeo, silverMat);
            powerBtn.rotation.x = Math.PI / 2; // Rotate 90deg to point along CAD Z-axis (up)
            powerBtn.position.set(20.0, 0, 38.0); // Pokes 3mm above Z=40 top roof
            electronicsGroup.add(powerBtn);

            // Shutter Button (X=50, Y=0, Z=38, radius=5.8, height=10)
            const shutterBtnGeo = new THREE.CylinderGeometry(5.8, 5.8, 10, 32);
            const shutterBtn = new THREE.Mesh(shutterBtnGeo, silverMat);
            shutterBtn.rotation.x = Math.PI / 2; // Rotate 90deg to point along CAD Z-axis (up)
            shutterBtn.position.set(50.0, 0, 38.0); // Pokes 3mm above Z=40 top roof
            electronicsGroup.add(shutterBtn);

            // --- C. TYPE-C USB PORT (FEMALE RECEPTACLE) ---
            // Center it so it rests on the bottom of the 7mm hole (Z=-36.3)
            // Port height is 3.5, so center is at -36.3 + 1.75 = -34.55

            // 1. Outer silver shell (CAD X length 8, CAD Y width 9, CAD Z height 3.5)
            const usbPortGeo = new THREE.BoxGeometry(8, 9, 3.5);
            const usbPort = new THREE.Mesh(usbPortGeo, silverMat);
            usbPort.position.set(-66.0, 0, -34.55); // Rests on the base of the hole
            electronicsGroup.add(usbPort);

            // 2. Inner dark void (to make the female port look hollow)
            // Placed precisely at the front face (X=-69.9) to obscure the silver block
            const usbVoidGeo = new THREE.BoxGeometry(0.2, 7.5, 2.0);
            const usbVoidMat = new THREE.MeshBasicMaterial({ color: 0x050505 }); // Pitch black
            const usbVoid = new THREE.Mesh(usbVoidGeo, usbVoidMat);
            usbVoid.position.set(-69.9, 0, -34.55);
            electronicsGroup.add(usbVoid);

            // 3. Central connector tongue (dark grey plastic)
            const usbTongueGeo = new THREE.BoxGeometry(0.4, 5.0, 0.5);
            const usbTongueMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9, metalness: 0.1 });
            const usbTongue = new THREE.Mesh(usbTongueGeo, usbTongueMat);
            usbTongue.position.set(-69.8, 0, -34.55); // Pokes out slightly from the void
            electronicsGroup.add(usbTongue);

            // --- D. FLASH MODULE & LIGHT BEAM ---
            // 1. Glowing white flash bulb inside the enclosure
            const flashGeo = new THREE.BoxGeometry(8, 8, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // Pure bright white, unaffected by shadows
            const flashBulb = new THREE.Mesh(flashGeo, flashMat);
            flashBulb.position.set(-45.0, 21.0, 44.5); // Sits inside the flash enclosure box (Y=19 to 25)
            electronicsGroup.add(flashBulb);

            // 2. Point Light to illuminate the front of the camera body
            const flashLight = new THREE.PointLight(0xffffff, 2.5, 150);
            flashLight.position.set(-45.0, 30.0, 44.5); // Placed slightly in front of the window (Y=25)
            electronicsGroup.add(flashLight);

            // 3. Volumetric-style Light Beam (Additive blending cone)
            const beamGeo = new THREE.ConeGeometry(50, 200, 32, 1, true); // radius 50, length 200
            const beamMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.1,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.rotation.x = Math.PI; // Flip cone so tip points backwards (towards camera face)
            // If length is 200, center is 100 units away from tip. Tip is at Y=25, so center is Y=125.
            beam.position.set(-45.0, 125.0, 44.5);
            electronicsGroup.add(beam);

            // --- E. ACTIVE LCD SCREEN (DIGITAL NOISE) ---
            const screenCanvas = document.createElement('canvas');
            screenCanvas.width = 128; // Lower resolution for blocky digital aesthetic
            screenCanvas.height = 96;
            const ctx = screenCanvas.getContext('2d');

            // Generate raw RGB static/noise
            const imgData = ctx.createImageData(screenCanvas.width, screenCanvas.height);
            for (let i = 0; i < imgData.data.length; i += 4) {
                const noise = Math.random() * 255; // Grayscale noise base
                const r_noise = Math.random() > 0.95 ? Math.random() * 255 : noise; // Occasional red glitch
                const b_noise = Math.random() > 0.95 ? Math.random() * 255 : noise; // Occasional blue glitch
                imgData.data[i] = r_noise;       // R
                imgData.data[i + 1] = noise;       // G
                imgData.data[i + 2] = b_noise;     // B
                imgData.data[i + 3] = 255;         // Alpha
            }
            ctx.putImageData(imgData, 0, 0);

            const screenTexture = new THREE.CanvasTexture(screenCanvas);
            screenTexture.magFilter = THREE.NearestFilter; // Crisper pixelation

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
            const screenFaceMat = new THREE.MeshBasicMaterial({ map: screenTexture });

            // Materials: right (+X), left (-X), front (+Y), back (-Y), top (+Z), bottom (-Z)
            // Face index 3 is -Y (facing back window of back plate)
            const boxMats = [
                frameMat,      // +X
                frameMat,      // -X
                frameMat,      // +Y
                screenFaceMat, // -Y
                frameMat,      // +Z
                frameMat       // -Z
            ];

            const screenGeo = new THREE.BoxGeometry(65, 1, 48);
            const screenMesh = new THREE.Mesh(screenGeo, boxMats);
            screenMesh.position.set(0, -22.5, 0); // Positioned flat behind the back plate window (Y=-23)
            electronicsGroup.add(screenMesh);

            group.add(electronicsGroup);
        }

        function loadSTL(path) {
            if (mesh) { scene.remove(mesh); mesh = null; }
            if (assemblyGroup) { scene.remove(assemblyGroup); assemblyGroup = null; }

            if (path === "assembled" || path === "camera_design") {
                loadAssembly(path === "camera_design");
                return;
            }

            document.getElementById('loading').style.display = 'block';

            const loader = new THREE.STLLoader();
            const nocachePath = path + "?t=" + new Date().getTime();

            loader.load(nocachePath, function (geometry) {
                // Set colors based on the part being loaded
                let partColor = 0xff5500; // Bright Candy Orange (Front/Back Plates)
                let partRoughness = 0.1;
                let partMetalness = 0.4;
                if (path.includes("main_chassis") || path.includes("door")) {
                    partColor = 0xf5f5f0; // Crisp Off-White (Chassis/Doors)
                    partRoughness = 0.8;
                    partMetalness = 0.1;
                }

                const material = new THREE.MeshStandardMaterial({
                    color: partColor,
                    roughness: partRoughness, // Slightly rougher for an industrial feel
                    metalness: partMetalness,
                });
                mesh = new THREE.Mesh(geometry, material);

                // Automatically center the object on the screen
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                mesh.position.sub(center);

                // Rotate to match typical CAD Z-up orientation
                mesh.rotation.x = -Math.PI / 2;

                scene.add(mesh);
                document.getElementById('loading').style.display = 'none';
            }, undefined, function (error) {
                console.error(error);
                document.getElementById('loading').innerText = 'Error loading STL';
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // required if controls.enableDamping is true
            renderer.render(scene, camera);
        }

        // Measurement Logic Setup
        function setupMeasurement() {
            const measureToggle = document.getElementById('measureToggle');
            const measureResults = document.getElementById('measureResults');
            const p1Coords = document.getElementById('p1Coords');
            const p2Coords = document.getElementById('p2Coords');
            const distVal = document.getElementById('distVal');
            const clearMeasureBtn = document.getElementById('clearMeasureBtn');

            measureToggle.addEventListener('change', (e) => {
                measureEnabled = e.target.checked;
                if (measureEnabled) {
                    measureResults.style.display = 'block';
                    document.body.style.cursor = 'crosshair';
                } else {
                    measureResults.style.display = 'none';
                    document.body.style.cursor = 'default';
                    clearMeasurement();
                }
            });

            clearMeasureBtn.addEventListener('click', clearMeasurement);

            window.addEventListener('pointerdown', (e) => {
                pointerStartX = e.clientX;
                pointerStartY = e.clientY;
            });

            window.addEventListener('pointerup', (e) => {
                if (!measureEnabled) return;

                // Ignore measurement clicks if the user is dragging to pan/orbit the camera
                const deltaX = Math.abs(e.clientX - pointerStartX);
                const deltaY = Math.abs(e.clientY - pointerStartY);
                if (deltaX > 3 || deltaY > 3) return;

                // Perform raycasting against active meshes
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);

                let targets = [];
                if (mesh) targets.push(mesh);
                if (assemblyGroup) {
                    assemblyGroup.traverse((child) => {
                        if (child.isMesh) targets.push(child);
                    });
                }

                const intersects = raycaster.intersectObjects(targets);
                if (intersects.length > 0) {
                    addMeasurementPoint(intersects[0].point);
                }
            });

            function clearMeasurement() {
                if (marker1) { scene.remove(marker1); marker1 = null; }
                if (marker2) { scene.remove(marker2); marker2 = null; }
                if (measureLine) { scene.remove(measureLine); measureLine = null; }
                point1 = null;
                point2 = null;
                p1Coords.innerText = "None";
                p2Coords.innerText = "None";
                distVal.innerText = "--";
            }

            function addMeasurementPoint(point) {
                if (!point1) {
                    point1 = point.clone();

                    const markerGeo = new THREE.SphereGeometry(1.2, 16, 16);
                    const markerMat = new THREE.MeshBasicMaterial({ color: 0xff3333, depthTest: false });
                    marker1 = new THREE.Mesh(markerGeo, markerMat);
                    marker1.position.copy(point1);
                    marker1.renderOrder = 999;
                    scene.add(marker1);

                    p1Coords.innerText = `[${point1.x.toFixed(1)}, ${point1.y.toFixed(1)}, ${point1.z.toFixed(1)}]`;
                } else if (!point2) {
                    point2 = point.clone();

                    const markerGeo = new THREE.SphereGeometry(1.2, 16, 16);
                    const markerMat = new THREE.MeshBasicMaterial({ color: 0xff3333, depthTest: false });
                    marker2 = new THREE.Mesh(markerGeo, markerMat);
                    marker2.position.copy(point2);
                    marker2.renderOrder = 999;
                    scene.add(marker2);

                    p2Coords.innerText = `[${point2.x.toFixed(1)}, ${point2.y.toFixed(1)}, ${point2.z.toFixed(1)}]`;

                    const lineMat = new THREE.LineBasicMaterial({ color: 0xff3333, depthTest: false });
                    const lineGeo = new THREE.BufferGeometry().setFromPoints([point1, point2]);
                    measureLine = new THREE.Line(lineGeo, lineMat);
                    measureLine.renderOrder = 999;
                    scene.add(measureLine);

                    const distance = point1.distanceTo(point2);
                    distVal.innerText = distance.toFixed(2);
                } else {
                    clearMeasurement();
                    addMeasurementPoint(point);
                }
            }
        }

        init();
        setupMeasurement();
    </script>
</body>

</html>
